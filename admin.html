<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Final Assessment ISO 9001:2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<main id="vLogin" class="view login card" hidden>
  <div class="brand"><img class="logo-img" src="assets/logo.png" alt="Logo" onerror="this.outerHTML='<div class=logo>QMS</div>'"><span>Trainer Console</span></div>
  <form id="fLogin">
    <label class="f" for="em">Email</label><input id="em" type="email" required autocomplete="username">
    <label class="f" for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
    <div class="err" id="lErr"></div><button class="btn block" type="submit">Masuk</button>
  </form>
</main>

<div id="vApp" class="view" hidden>
  <header class="top"><div class="in">
    <div class="brand"><img class="logo-img" src="assets/logo.png" alt="Logo" onerror="this.outerHTML='<div class=logo>QMS</div>'"><span>Trainer Console</span></div><div class="sp"></div>
    <span class="mut small" id="me"></span><button class="btn ghost sm" id="bOut">Keluar</button>
  </div></header>

  <main class="wrap wide" id="vList">
    <nav class="navtabs">
      <button class="ntab on" data-p="list">Peserta</button><button class="ntab" data-p="batch">Batch</button>
      <div class="sp"></div><span class="mut small" id="upd"></span>&nbsp;<button class="btn ghost sm" id="bRef">Refresh</button>
    </nav>

    <section id="pgList">
      <div class="stats" id="stats"></div>
      <div class="bar">
        <input type="search" id="qs" placeholder="Cari nama atau jabatan…">
        <select id="fb"><option value="all">Semua batch</option></select>
        <select id="fs"><option value="all">Semua status</option><option value="in_progress">Mengerjakan</option><option value="submitted">Menunggu penilaian</option><option value="graded">Selesai dinilai</option></select>
        <div class="sp"></div><button class="btn sm" id="bXls">Ekspor Excel</button>
      </div>
      <div class="tw"><table><thead><tr><th>Peserta</th><th>Status</th><th>Progres</th><th>Mulai</th><th>Aktivitas terakhir</th><th>Durasi</th><th>Nilai</th></tr></thead><tbody id="tb"></tbody></table></div>
    </section>

    <section id="pgBatch" hidden>
      <div class="card" style="margin:24px 0">
        <h2>Buat Batch Baru</h2><p class="mut small" style="margin:4px 0 16px">Satu batch untuk satu Copart. Kode 6 angka dibuat otomatis dan dibagikan ke peserta.</p>
        <div class="frow">
          <div><label class="f" for="bnName">Nama Copart</label><input id="bnName" type="text" maxlength="120" placeholder="Contoh: PT Sinar Jaya Abadi"></div>
          <div><label class="f" for="bnNote">Keterangan (opsional)</label><input id="bnNote" type="text" maxlength="200" placeholder="Contoh: Angkatan 1 · 14 Oktober"></div>
          <button class="btn" id="bnAdd">Buat Batch</button>
        </div>
        <div class="err" id="bnErr"></div><div id="bnOk"></div>
      </div>
      <div class="tw"><table><thead><tr><th>Copart</th><th>Kode</th><th>Status</th><th>Peserta</th><th>Dibuat</th><th></th></tr></thead><tbody id="bt"></tbody></table></div>
    </section>
  </main>

  <main class="wrap wide" id="vDet" hidden></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="assets/config.js"></script><script src="assets/questions.js"></script><script src="assets/admin.js"></script>
</body></html>
